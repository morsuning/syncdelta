name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "0" # same configuration as the released binaries
        run: |
          set +e
          go test -count=1 -timeout 25m ./... > test.log 2>&1
          rc=$?
          cat test.log
          if [ $rc -ne 0 ]; then
            msg=$(head -c 3500 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test failures::$msg"
          fi
          exit $rc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Every Go source file carries the MPL-2.0 notice
        run: |
          missing=$(grep -L "Mozilla Public" $(git ls-files '*.go' build.sh web/index.html) || true)
          test -z "$missing" || { echo "missing MPL header: $missing"; exit 1; }

  build:
    name: build.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build all targets
        run: ./build.sh
      - name: Checksums
        run: cd dist && sha256sum -c SHA256SUMS
